<!DOCTYPE html>
<html>
<head>
    <title>Diamond Shop Final</title>

    <style>
        body {
            background: white;
            font-family: Arial;
            text-align: center;
        }

        .card {
            background: #f2f9ff;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
        }

        input, select {
            padding: 10px;
            width: 80%;
            margin: 5px;
        }

        button {
            background: #3399ff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
        }
    </style>

    <script>
        function sendOrder(diamond) {
            let userId = document.getElementById("userId").value;
            let payment = document.getElementById("payment").value;

            let token = "@MLBBdianomdbot";
            let chatId = "https://api.telegram.org/bot";

            let text = "💎 NEW ORDER\n"
                     + "Diamonds: " + diamond + "\n"
                     + "User ID: " + userId + "\n"
                     + "Payment: " + payment;

            let url = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" 
                    + chatId + "&text=" + encodeURIComponent(text);

            fetch(url)
            .then(response => alert("Order Sent!"))
            .catch(error => alert("Error"));
        }
    </script>

</head>

<body>

<h1>💎 Diamond Shop Final Boss</h1>

<div class="card">
    <input type="text" id="userId" placeholder="User ID">
    
    <select id="payment">
        <option>KBZ Pay</option>
        <option>Wave Pay</option>
    </select>
</div>

<div class="card">
    <p>💠 86 Diamonds - 2,500 MMK</p>
    <button onclick="sendOrder('86')">Order</button>
</div>

<div class="card">
    <p>💠 172 Diamonds - 4,800 MMK</p>
    <button onclick="sendOrder('172')">Order</button>
</div>

</body>
</html>
